# ============================================================
# LocalHub 云端 + 比特潮汐博客 · Nginx 站点配置
# 部署路径：
#   博客（根路径）: /www/wwwroot/huhst-life   → https://lxlrwxs.top
#   LocalHub 网页版: /hub/ 反代到 127.0.0.1:3001
#   思维导图:       /mindmap-app/ 反代到 127.0.0.1:18880
# ============================================================
server {
    listen 80;
    server_name lxlrwxs.top www.lxlrwxs.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name lxlrwxs.top www.lxlrwxs.top;

    # SSL（Let's Encrypt，已有）
    ssl_certificate     /etc/letsencrypt/live/lxlrwxs.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lxlrwxs.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 安全头
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # ---- 本地测试时用 /blog 反代博客；生产环境博客在根路径 ----
    # 生产：根路径 → 博客静态目录
    root /www/wwwroot/huhst-life;
    index index.html;

    # LocalHub 网页版（子路径反代）
    location /hub/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # LocalHub 后端 API（slugify：/api 绝对路径 → 反代到 LocalHub）
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 排行榜（LocalHub 内 iframe 子应用）
    location /lb/ {
        proxy_pass http://127.0.0.1:3001/lb/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 思维导图（独立服务）
    location /mindmap-app/ {
        proxy_pass http://127.0.0.1:18880/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 100m;
    }

    # 博客为 SPA：非文件请求回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|woff2?|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
}