# ============================================================
# LocalHub 云端 · tools.lxlrwxs.top 站点配置
# 仅监听 80 端口（HTTP）。HTTPS 由 Cloudflare CDN 终止，回源到 80。
# 前端静态: /var/www/html（cloud/web/dist 打包产物）
# 后端 API: /api 反代到 127.0.0.1:3000（NestJS）
# ============================================================
server {
    listen 80;
    server_name tools.lxlrwxs.top;

    root /var/www/html;
    index index.html;

    # 后端 API 反代（仅本机 3000，公网不开放 3000）
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        # 禁止 Cloudflare 缓存 API 响应
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # AI 排行榜子应用（前端构建产物 dist/lb）
    location /lb/ {
        alias /var/www/html/lb/;
        try_files $uri $uri/ /lb/index.html;
    }

    # 思维导图子应用（前端构建产物 dist/mindmap-app）
    location /mindmap-app/ {
        alias /var/www/html/mindmap-app/;
        try_files $uri $uri/ /mindmap-app/index.html;
    }

    # 前端 SPA：非文件请求回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（带 hash 文件名永不失效）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 其他静态资源
    location ~* \.(png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # 安全头
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    access_log /var/log/nginx/tools.lxlrwxs.top.log;
    error_log  /var/log/nginx/tools.lxlrwxs.top.error.log;
}