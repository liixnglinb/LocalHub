<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>剑来 · 开放世界人生模拟器</title>
<style>
  :root{
    --bg:#14110c; --bg2:#1d1810; --panel:#231b12; --panel2:#2c2217; --line:#3a2e1d;
    --ink:#ece4d2; --dim:#9b9180; --gold:#c8a85a; --gold2:#e6c87a; --red:#b5462f; --jade:#5a8c6a; --blue:#6f93b8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:"Songti SC","SimSun","STSong",serif;line-height:1.8;}
  body{background:#0d0b07;min-height:100vh;}
  #app{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:22px 16px 70px;}
  .narr,.topbar,.broadcast,.free{text-shadow:0 1px 5px rgba(0,0,0,.7);}
  .title-art{text-align:center;padding:30px 10px 14px;}
  .title-art h1{font-size:42px;letter-spacing:12px;margin:0;color:var(--gold2);text-shadow:0 2px 18px rgba(200,168,90,.25);}
  .title-art .sub{color:var(--dim);letter-spacing:5px;margin-top:8px;font-size:14px;}
  .card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);
    border-radius:12px;padding:20px 22px;margin:16px 0;box-shadow:0 10px 30px rgba(0,0,0,.35);}
  .narr{font-size:16.5px;white-space:pre-wrap;}
  .narr .nar{display:block;margin:2px 0;color:var(--ink);}
  .narr .say{display:block;margin:6px 0;padding-left:10px;border-left:2px solid var(--gold);color:#f0e8d6;}
  .narr .who{color:var(--jade);font-weight:700;}
  .narr .hl{color:var(--gold2);}
  .chapter{color:var(--gold);letter-spacing:3px;font-size:13.5px;margin-bottom:8px;}
  .broadcast{background:#120e09;border:1px solid var(--line);border-radius:8px;padding:8px 12px;
    margin-top:14px;font-size:14px;color:var(--gold2);letter-spacing:1px;text-align:center;}
  .choices{display:flex;flex-direction:column;gap:11px;margin-top:16px;}
  .choice{background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--gold);
    padding:13px 15px;border-radius:8px;cursor:pointer;transition:.16s;font-size:15.5px;}
  .choice:hover{background:#322718;border-left-color:var(--gold2);transform:translateX(3px);}
  .choice .hint{display:block;color:var(--dim);font-size:13px;margin-top:5px;font-style:italic;}
  .choice .tag{float:right;color:var(--jade);font-size:12.5px;margin-left:8px;}
  .free{display:flex;gap:8px;margin-top:14px;}
  .free input{flex:1;background:#120e09;border:1px solid var(--line);color:var(--ink);
    border-radius:8px;padding:10px 12px;font-family:inherit;font-size:15px;}
  .free button{background:var(--bg2);border:1px solid var(--line);color:var(--gold2);
    border-radius:8px;padding:0 16px;cursor:pointer;font-family:inherit;}
  .topbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:4px;align-items:center;}
  .topbar .who{color:var(--ink);font-size:14.5px;}
  .topbar .who b{color:var(--gold2);}
  .btns{display:flex;gap:7px;flex-wrap:wrap;}
  button.btn{background:var(--bg2);color:var(--ink);border:1px solid var(--line);padding:6px 12px;
    border-radius:7px;cursor:pointer;font-family:inherit;font-size:13.5px;transition:.15s;}
  button.btn:hover{border-color:var(--gold);color:var(--gold2);}
  .id-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:14px;}
  .id{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:15px;cursor:pointer;transition:.15s;}
  .id:hover{border-color:var(--gold);background:#2e2418;}
  .id h3{margin:0 0 6px;color:var(--gold2);letter-spacing:2px;font-size:16px;}
  .id p{margin:0;font-size:13.5px;color:var(--dim);}
  input.name{font-family:inherit;font-size:17px;background:var(--bg2);color:var(--ink);
    border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:100%;margin-top:8px;}
  /* 修为面板 */
  .rpanel{border:1px solid var(--gold);background:#fffdf3;color:#3a2e1a;border-radius:12px;
    padding:16px 18px;margin:14px 0;font-family:"Songti SC","SimSun",serif;box-shadow:0 8px 26px rgba(0,0,0,.4);}
  .rpanel .big{color:#b8860b;font-size:22px;font-weight:700;letter-spacing:2px;}
  .rpanel .rule{color:#e6c86a;margin:8px 0;border-top:1px solid #e6c86a;opacity:.7;}
  .rpanel .nm{color:#5a3a1a;font-size:18px;font-weight:700;}
  .rpanel .lb{color:#666;}
  .rpanel .pill{display:inline-block;background:#8b4513;color:#fff;border-radius:5px;padding:1px 8px;font-size:13px;margin-right:6px;}
  .rpanel .pill2{display:inline-block;background:#d8a020;color:#fff;border-radius:5px;padding:1px 8px;font-size:13px;}
  .rpanel .item{color:#c0392b;font-size:14px;}
  .rpanel .sts{color:#c0392b;font-size:14px;}
  .rpanel h4{background:#8b4513;color:#fff;display:inline-block;padding:2px 10px;border-radius:5px;font-size:14px;margin:10px 0 6px;}
  .rpanel ul{margin:4px 0;padding-left:20px;}
  .rpanel li{color:#b8860b;font-size:14px;margin:2px 0;}
  .death{border:1px solid var(--red);background:#1c0f0c;border-radius:12px;padding:20px;margin:16px 0;text-align:center;}
  .death .t{color:var(--red);font-size:24px;letter-spacing:6px;}
  .death .d{color:var(--ink);font-size:15px;margin-top:10px;white-space:pre-wrap;}
  .footer{text-align:center;color:var(--dim);font-size:12px;margin-top:28px;letter-spacing:2px;}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#2c2218;border:1px solid var(--gold);
    color:var(--gold2);padding:9px 16px;border-radius:8px;opacity:0;transition:.3s;pointer-events:none;font-size:14px;z-index:50;}
  .toast.show{opacity:1;}
  .simplelog{font-size:13.5px;color:var(--dim);}
  .simplelog div{margin:2px 0;}
  @media(max-width:560px){.id-grid{grid-template-columns:1fr}.title-art h1{font-size:32px;letter-spacing:7px}}
  /* 视听反馈 */
  .fx-flash{position:fixed;inset:0;pointer-events:none;z-index:60;opacity:0;transition:opacity .22s;
    background:radial-gradient(circle at 50% 50%, rgba(90,140,106,.45), transparent 70%);}
  .fx-flash.down{background:radial-gradient(circle at 50% 50%, rgba(181,70,47,.5), transparent 70%);}
  .fx-shake{animation:fxshake .42s}
  @keyframes fxshake{0%,100%{transform:translate(0,0)}20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-2px)}}
  .fx-glow{position:fixed;inset:0;pointer-events:none;z-index:60;background:radial-gradient(circle at 50% 45%, rgba(230,200,122,.35), transparent 60%);
    opacity:0;animation:fxglow .95s ease-out forwards;}
  @keyframes fxglow{0%{opacity:0;transform:scale(.8)}30%{opacity:1}100%{opacity:0;transform:scale(1.3)}}
  .fx-vignette{position:fixed;inset:0;pointer-events:none;z-index:55;
    background:radial-gradient(circle at 50% 50%, transparent 28%, rgba(0,0,0,.86) 100%);opacity:0;animation:fxvig 1.2s ease-in forwards;}
  @keyframes fxvig{to{opacity:1}}
  .btn.audio-on{border-color:var(--gold);color:var(--gold2);}
  /* ===== 水墨场景 / 昼夜 / 天气 ===== */
  .scene-bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:#0d0b07;}
  .scene-tint{position:absolute;inset:0;pointer-events:none;transition:background .8s;}
  .phase-dawn{background:linear-gradient(180deg,rgba(185,138,106,.20),transparent 55%);}
  .phase-day{background:linear-gradient(180deg,rgba(255,250,235,.10),transparent 60%);}
  .phase-dusk{background:linear-gradient(180deg,rgba(217,138,78,.22),transparent 60%);}
  .phase-night{background:linear-gradient(180deg,rgba(8,14,30,.58),rgba(8,14,30,.28));}
  .phase-night-end{background:linear-gradient(180deg,rgba(20,25,45,.42),transparent 60%);}
  .wx{position:absolute;inset:0;pointer-events:none;}
  .wx-rain{background:repeating-linear-gradient(102deg, transparent 0 7px, rgba(200,220,235,.16) 7px 8px);background-size:60px 60px;animation:wxrain .5s linear infinite;opacity:.5;}
  @keyframes wxrain{to{background-position:-60px 60px;}}
  .wx-snow{background-image:radial-gradient(2px 2px at 20% 30%, #fff 50%, transparent),radial-gradient(2px 2px at 60% 70%, #fff 50%, transparent),radial-gradient(1.5px 1.5px at 80% 20%, #fff 50%, transparent),radial-gradient(2px 2px at 40% 85%, #fff 50%, transparent),radial-gradient(1.5px 1.5px at 10% 60%, #fff 50%, transparent);background-size:220px 220px;animation:wxsnow 9s linear infinite;opacity:.6;}
  @keyframes wxsnow{to{background-position:0 220px;}}
  .wx-fog{background:radial-gradient(circle at 30% 40%, rgba(220,225,230,.30), transparent 40%),radial-gradient(circle at 72% 62%, rgba(220,225,230,.24), transparent 45%);animation:wxfog 14s ease-in-out infinite alternate;opacity:.7;}
  @keyframes wxfog{from{transform:translateX(-30px);}to{transform:translateX(40px);}}
  .wx-thunder{animation:wxthunder 4s infinite;}
  @keyframes wxthunder{0%,90%,100%{background:rgba(200,220,255,0);}92%{background:rgba(200,220,255,.38);}95%{background:rgba(200,220,255,.12);}97%{background:rgba(200,220,255,.30);}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
"use strict";

/* ================= 数值与境界 ================= */
const WUFU = ["未入门","泥胚","木胎","水银","英魂","雄魄","武胆","金身","羽化","山巅"];
const LIANQI = ["未入门","铜皮","草根","柳筋","骨气","铸炉","洞府","观海","龙门","金丹","元婴","玉璞","仙人","飞升","十四合道","十五境"];
/* 十二时辰 / 天气 / 道途 / 场景 / 剑意 */
const SHICHEN = ["子时","丑时","寅时","卯时","辰时","巳时","午时","未时","申时","酉时","戌时","亥时"];
function shichenPhase(h){ if(h===3) return "night-end"; if(h>=4&&h<=6) return "dawn"; if(h===7||h===8) return "day"; if(h===9||h===10) return "dusk"; return "night"; }
const WEATHER = ["晴","雨","雪","雾","雷"];
const WEATHER_NAME = {晴:"晴空",雨:"细雨",雪:"落雪",雾:"薄雾",雷:"雷雨"};
const PATHS = {
  wufu:{ name:"武夫道（肉身成圣）", desc:"桩功蓄力，近身肉搏，不靠灵气。", fx:{wufu:1,tupo:10} },
  lianqi:{ name:"练气道（吐纳天地）", desc:"术法符箓，远程消耗。", fx:{lianqi:1,lingqi:12} },
  jianxiu:{ name:"剑修道（本命飞剑）", desc:"飞剑出窍，杀力最高。", fx:{jianyi:10,lingqi:6} },
  sanxiu:{ name:"散修三修（博采众长）", desc:"武夫/练气/剑修皆涉。", fx:{tupo:5,lingqi:5,wuxing:5} },
};
const SCENE_NAME = { lizhu:"骊珠洞天", niping:"泥瓶巷", changcheng:"剑气长城", shujian:"书简湖", shuyuan:"浩然书院", ouhua:"藕花福地", manhuang:"蛮荒天下" };
function jianyiTier(x){ if(x>=90) return "剑意通明"; if(x>=70) return "剑心澄澈"; if(x>=50) return "大成"; if(x>=30) return "小成"; if(x>=12) return "初窥"; return "未入门"; }
function benxinTier(x){
  const t=[[9,'灰烬'],[19,'蒙尘'],[29,'迟疑'],[39,'摇摆'],[49,'自守'],[59,'持正'],[69,'明澈'],[79,'坚毅'],[89,'通明'],[100,'剑心澄澈']];
  for(const [m,n] of t) if(x<=m) return n; return '剑心澄澈';
}
const IDENTITIES = {
  niping:{ name:"泥瓶巷的少年", desc:"陈平安的邻居发小——恶日出生，本命瓷五岁那年碎了，留不住福缘。",
    fx:{benxin:6}, open:"你蹲在泥瓶巷的门槛上，看陈平安把一捆柴码齐。他冲你笑了一下，没说话——你们从小就这样。" },
  xueshu:{ name:"学塾的学童", desc:"齐静春的学生——每日听先生讲《论语》。",
    fx:{benxin:4, lianqi:1}, open:"学塾里书声琅琅。齐先生捋着袖子走过你桌边，只轻声问了一句：‘今日，可曾用心？’" },
  tiejiang:{ name:"铁匠铺的学徒", desc:"阮邛铺子的伙计——阮秀的师兄，烟火气最重。",
    fx:{qixue:4}, open:"铁匠铺火星四溅。阮秀踮脚往炉里添炭，回头瞪你：‘看什么看，火快灭了！’" },
  yapu:{ name:"药铺的学徒", desc:"杨老头铺子的伙计——他教你认药，话里有话。",
    fx:{benxin:2}, open:"杨家药铺里一股草药味。杨老头叼着旱烟袋，眯眼看你：‘脚下生根了？去，把那株黄精分拣了。’" },
  waixiang:{ name:"流落小镇的外乡孩子", desc:"与所有人从陌生开始——自由最高。",
    fx:{}, open:"你背着破包袱站在镇口，谁也不认识你，你也不认识谁。风吹过，街上的眼光扫过来，又移开。" },
};

/* ================= 状态 ================= */
let state=null;
const $app=document.getElementById("app");
const $toast=document.getElementById("toast");
function toast(m){ $toast.textContent=m; $toast.classList.add("show"); setTimeout(()=>$toast.classList.remove("show"),1500); }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

const SAVE_KEY="jianlai_sim_v1";
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }catch(e){} }
function load(){ try{ const r=localStorage.getItem(SAVE_KEY); if(!r) return false; state=JSON.parse(r); return true; }catch(e){ return false; } }
function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }

/* ================= 剧情节点 BEATS ================= */
/* line: {t:'nar'|'say', who?, text, if?}  choice:{label,hint?,fx?,go?,if?,death?,deathText?,tag?} */
const BEATS = {
  open:{
    node:"序", round:0,
    lines:[
      {t:'nar', text:"二月二，龙抬头。泥瓶巷方向传来低低的驱蛇声。"},
      {t:'nar', text:"今晚的镇子，和往常不太一样——听说，镇口来了很多陌生人。"},
      {t:'nar', text:"在一切开始之前——你是谁，又是怎么来的？"},
    ],
    choices:[
      {label:"顺应：先到街口，远远看看那些‘山上神仙’的排场", hint:"低风险，长见识，但别靠太近", fx:{benxin:1}, go:"e1a"},
      {label:"逆反·搞事：直接凑上去，跟外乡修士搭话", hint:"高风险，你只是个凡人少年，他们未必把你当人", fx:{benxin:-1}, go:"e1_risk"},
      {label:"观望·探索：先回巷子，问问陈平安听见了什么", hint:"稳妥，加深与发小的羁绊", fx:{}, go:"e1_peace"},
      {label:"自由行动（做任何你想做的事）", hint:"", fx:{}, go:"__free__"},
    ]
  },

  /* ===== ① 外乡人涌入 ===== */
  e1a:{
    node:"①外乡人涌入",
    lines:[
      {t:'nar', text:"镇口大路上，几人衣袂生风。一人一尘不染，靴上绣云；一人高冠大袖，锦衣玉带；还有个猿背人形的家伙，气场压得路边狗都不叫了。"},
      {t:'say', who:"街坊", text:"那是……山上神仙？"},
      {t:'nar', text:"百姓们怯怯退开，又忍不住偷看。空气里有一股说不清的压迫。"},
    ],
    choices:[
      {label:"顺应：压下好奇，低头做自己的事", hint:"本心稳，但错过第一手情报", fx:{benxin:1}, go:"e1b"},
      {label:"逆反·搞事：故意从那猿背人形身边晃过去", hint:"他可能觉得你碍眼", fx:{benxin:-2}, go:"e1_provoke"},
      {label:"观望·探索：蹲在墙角，把他们的人数和打扮记下来", hint:"情报+，日后有用", fx:{benxin:1}, tag:"情报", go:"e1b"},
      {label:"自由行动", hint:"", fx:{}, go:"__free__"},
    ]
  },
  e1_risk:{
    node:"①外乡人涌入",
    lines:[
      {t:'nar', text:"你挤进人群，冲那锦衣玉带的人拱手：‘前辈，小辈初来……’"},
      {t:'say', who:"苻南华", text:"（瞥你一眼，似看蝼蚁）哪来的泥腿子，也配说话。"},
      {t:'nar', text:"一股劲风掀得你踉跄后退，摔在泥里。周围有人笑，有人别过头。"},
    ],
    choices:[
      {label:"顺应：爬起来拍拍土，退到一旁", hint:"吃瘪，但保住颜面", fx:{benxin:1, qixue:-2}, go:"e1b"},
      {label:"逆反·搞事：盯着他背影，记下了这张脸", hint:"记仇容易，报仇难", fx:{benxin:-1}, go:"e1b", tag:"结怨·苻南华"},
      {label:"自由行动", hint:"", fx:{}, go:"__free__"},
    ]
  },
  e1_peace:{
    node:"①外乡人涌入",
    lines:[
      {t:'nar', text:"你拐回泥瓶巷。陈平安正把晾干的衣服收进屋，见你回来，递过半块烤红薯。"},
      {t:'say', who:"陈平安", text:"镇口来了不少人。我昨儿听见，说是冲着咱们小镇来的。"},
      {t:'nar', text:"他说话很轻，像怕惊动什么。‘我答应你的事情，就一定会做到’——这是他常挂在嘴边的话。"},
    ],
    choices:[
      {label:"顺应：拍拍他肩，‘有我在’", hint:"羁绊+", fx:{}, go:"e1b", tag:"与陈平安更近"},
      {label:"逆反·搞事：拉着他去镇口看热闹", hint:"他多半会皱眉，但拗不过你", fx:{benxin:-1}, go:"e1a"},
      {label:"自由行动", hint:"", fx:{}, go:"__free__"},
    ]
  },
  e1_provoke:{
    node:"①外乡人涌入",
    lines:[
      {t:'nar', text:"你从那猿背人形身边大摇大摆走过，还吹了声口哨。"},
      {t:'say', who:"搬山猿", text:"（垂眼，声音如磨石）小子，你身上这股不知死活的味儿，倒新鲜。"},
      {t:'nar', text:"它没动手——只是像看一只蚂蚁。可你知道，它若真恼，你连疼都来不及喊。"},
    ],
    choices:[
      {label:"顺应：装作没事，快步离开", hint:"怂得及时", fx:{benxin:2, qixue:-1}, go:"e1b"},
      {label:"逆反·搞事：回头冲它做了个鬼脸", hint:"作死边缘", fx:{benxin:-3}, go:"e1_death1"},
      {label:"自由行动", hint:"", fx:{}, go:"__free__"},
    ]
  },
  e1_death1:{
    node:"①外乡人涌入", death:true,
    lines:[
      {t:'nar', text:"你做了个鬼脸。搬山猿眉头一皱，指节轻轻一弹——"},
      {t:'nar', text:"你甚至没看清那道劲风从哪来，胸口已陷下去半寸。"},
    ],
    deathText:"你被一头大妖随手碾碎，像碾死一只蚂蚁。\n泥瓶巷少了个不知死活的少年，没人记得你的名字。"
  },
  e1b:{
    node:"①外乡人涌入",
    lines:[
      {t:'nar', text:"街边，一个头戴莲花冠的年轻道士支起摊子，招牌写着‘算命’。"},
      {t:'say', who:"陆沉", text:"年轻人，走过路过不要错过，抽支签，让贫道帮你算上一卦吧！十文……三文也行，五文，五文成交！"},
      {t:'say', who:"陆沉", text:"命里八尺，莫求一丈。"},
      {t:'nar', text:"他写完符纸，望着你（或陈平安）的背影幽幽一叹，把黄纸符文塞进你手里。"},

      ctx=new (window.AudioContext||window.webkitAudioContext)();
      comp=ctx.createDynamicsCompressor();
      master=ctx.createGain(); master.gain.value=0.9; master.connect(comp); comp.connect(ctx.destination);
      musicGain=ctx.createGain(); musicGain.gain.value=AUDIO_SETTINGS.musicOn?0.30:0.0001; musicGain.connect(master);
      sfxGain=ctx.createGain(); sfxGain.gain.value=AUDIO_SETTINGS.sfxOn?0.55:0.0001; sfxGain.connect(master);
      delay=ctx.createDelay(); delay.delayTime.value=0.23; delayGain=ctx.createGain(); delayGain.gain.value=0;
      delay.connect(delayGain); delayGain.connect(master);
    }catch(e){ ctx=null; }
  }
  function resume(){ if(ctx&&ctx.state==="suspended") ctx.resume(); }
  function tone(f,t,dur,opt){
    if(!ctx) return; opt=opt||{};
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type=opt.type||"sine"; o.frequency.value=f; if(opt.detune) o.detune.value=opt.detune;
    const peak=opt.gain==null?0.3:opt.gain, atk=opt.attack==null?0.01:opt.attack, rel=opt.release==null?0.18:opt.release;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+atk); g.gain.exponentialRampToValueAtTime(0.0001,t+dur+rel);
    o.connect(g); g.connect(opt.bus||musicGain); if(opt.space) g.connect(delay);
    o.start(t); o.stop(t+dur+rel+0.05);
  }
  function noise(t,dur,opt){
    if(!ctx) return; opt=opt||{};
    const n=Math.floor(ctx.sampleRate*dur), buf=ctx.createBuffer(1,n,ctx.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    const src=ctx.createBufferSource(); src.buffer=buf;
    const g=ctx.createGain(); g.gain.value=opt.gain==null?0.3:opt.gain;
    const f=ctx.createBiquadFilter(); f.type=opt.filter||"lowpass"; f.frequency.value=opt.cutoff||1400;
    src.connect(f); f.connect(g); g.connect(sfxGain); src.start(t); src.stop(t+dur);
  }
  const MOODS={
    calm:    {tempo:540, oct:0,  wave:"sine",     voice:"pad",   mel:[0,2,1,-1,3,2,4,-1,3,2,1,-1,2,0,-1,-1], bass:[0,-1,-1,0]},
    warm:    {tempo:500, oct:1,  wave:"triangle", voice:"pad",   mel:[4,3,2,4,3,2,1,2,0,1,2,3,2,1,-1,-1],       bass:[0,-1,0,-1]},
    tense:   {tempo:300, oct:0,  wave:"sawtooth", voice:"pluck", mel:[0,0,3,3,4,4,2,2,0,0,5,5,4,3,2,1],         bass:[0,-1,0,-1]},
    mystery: {tempo:640, oct:0,  wave:"sine",     voice:"pad", space:true, mel:[0,-1,3,-1,4,-1,2,-1,5,-1,3,-1,1,-1,0,-1], bass:[]},
    grand:   {tempo:440, oct:0,  wave:"triangle", voice:"pad", space:true, mel:[0,2,4,3,4,5,4,2,3,4,5,4,2,1,0,-1], bass:[0,-1,-1,0]},
    sorrow:  {tempo:700, oct:-1, wave:"sine",     voice:"pad",   mel:[2,1,0,-1,3,2,1,-1,0,-1,-1,-1,2,1,0,-1],   bass:[]},
  };
  function playStep(){
    if(!running||!ctx) return;
    const m=MOODS[mood]||MOODS.calm, now=ctx.currentTime+0.02, dur=m.tempo/1000*0.9;
    if(useUser){ step++; return; }
    const idx=step%m.mel.length, note=m.mel[idx];
    if(note>=0){
      const f=freq(note,m.oct);
      if(m.voice==="pluck") tone(f,now,dur*0.5,{type:m.wave,gain:0.20,attack:0.005,release:0.12});
      else tone(f,now,dur,{type:m.wave,gain:0.17,attack:0.06,release:0.28,space:m.space});
    }
    if(m.bass&&m.bass.length){
      const bi=step%m.bass.length, bn=m.bass[bi];
      if(bn!==undefined&&bn>=0) tone(freq(bn,m.oct-2),now,dur*1.7,{type:"sine",gain:0.15,attack:0.04,release:0.5});
    }
    step++;
  }
  function loop(){ if(!running) return; playStep(); timer=setTimeout(loop,(MOODS[mood]||MOODS.calm).tempo); }
  function startUserTrack(m){
    stopUserTrack();
    if(!AUDIO_SETTINGS.musicOn || !USER_MUSIC[m]){ useUser=false; return; }
    try{
      userEl=document.createElement("audio"); userEl.src=USER_MUSIC[m]; userEl.loop=true; userEl.volume=0.5;
      userEl.play().catch(function(){}); useUser=true;
    }catch(e){ useUser=false; }
  }
  function stopUserTrack(){ if(userEl){ try{userEl.pause();userEl.currentTime=0;}catch(e){} userEl=null; } useUser=false; }
  function refreshUser(){ if(USER_MUSIC[mood] && AUDIO_SETTINGS.musicOn) startUserTrack(mood); else stopUserTrack(); }
  function startMusic(){ ensure(); resume(); if(!ctx) return; if(running){ refreshUser(); return; } running=true; refreshUser(); loop(); }
  function setMood(m){ if(!m||m===mood){ mood=m||mood; return; } mood=m; if(running) refreshUser(); }
  function setMusicGain(v){ if(musicGain) musicGain.gain.setTargetAtTime(v?0.30:0.0001, ctx.currentTime, 0.05); }
  function setSfxGain(v){ if(sfxGain) sfxGain.gain.setTargetAtTime(v?0.55:0.0001, ctx.currentTime, 0.05); }
  function sfx(name){
    ensure(); resume(); if(!ctx) return;
    const t=ctx.currentTime+0.01;
    if(name==="ui"){ tone(880,t,0.05,{type:"sine",gain:0.18,attack:0.005,release:0.05,bus:sfxGain}); }
    else if(name==="good"){ tone(523,t,0.12,{type:"triangle",gain:0.25,bus:sfxGain}); tone(784,t+0.10,0.16,{type:"triangle",gain:0.25,bus:sfxGain}); }
    else if(name==="bad"){ tone(196,t,0.16,{type:"sawtooth",gain:0.18,cutoff:900,attack:0.005,release:0.2,bus:sfxGain}); tone(147,t+0.10,0.20,{type:"sawtooth",gain:0.18,bus:sfxGain}); }
    else if(name==="levelup"){ [523,659,784,1047].forEach(function(f,i){ tone(f,t+i*0.07,0.18,{type:"triangle",gain:0.22,bus:sfxGain}); }); tone(1568,t+0.30,0.4,{type:"sine",gain:0.12,bus:sfxGain}); }
    else if(name==="hit"){ noise(t,0.18,{gain:0.35,cutoff:1600}); tone(90,t,0.22,{type:"square",gain:0.25,bus:sfxGain}); }
    else if(name==="reveal"){ tone(330,t,0.5,{type:"sine",gain:0.18,attack:0.2,release:0.5,bus:sfxGain}); tone(392,t,0.5,{type:"sine",gain:0.15,attack:0.25,release:0.5,bus:sfxGain}); tone(277,t,0.6,{type:"sine",gain:0.16,attack:0.3,release:0.6,bus:sfxGain,space:true}); }
    else if(name==="death"){ [440,392,330,294,220].forEach(function(f,i){ tone(f,t+i*0.22,0.7,{type:"sine",gain:0.2,attack:0.05,release:0.6,bus:sfxGain}); }); }
    else if(name==="endingGood"){ [523,659,784,1047,1319].forEach(function(f,i){ tone(f,t+i*0.09,0.5,{type:"triangle",gain:0.2,bus:sfxGain,space:true}); }); [262,330,392].forEach(function(f){ tone(f,t+0.4,1.4,{type:"sine",gain:0.14,bus:sfxGain}); }); }
    else if(name==="endingBad"){ [330,294,247,196].forEach(function(f,i){ tone(f,t+i*0.18,0.9,{type:"sine",gain:0.2,attack:0.05,release:0.7,bus:sfxGain}); }); }
  }
  function toggleMusic(){ AUDIO_SETTINGS.musicOn=!AUDIO_SETTINGS.musicOn; localStorage.setItem("jl_music",AUDIO_SETTINGS.musicOn?"1":"0"); setMusicGain(AUDIO_SETTINGS.musicOn); if(AUDIO_SETTINGS.musicOn){ ensure(); resume(); refreshUser(); if(!running){ running=true; loop(); } } return AUDIO_SETTINGS.musicOn; }
  function toggleSfx(){ AUDIO_SETTINGS.sfxOn=!AUDIO_SETTINGS.sfxOn; localStorage.setItem("jl_sfx",AUDIO_SETTINGS.sfxOn?"1":"0"); setSfxGain(AUDIO_SETTINGS.sfxOn); return AUDIO_SETTINGS.sfxOn; }
  return { startMusic:startMusic, setMood:setMood, sfx:sfx, toggleMusic:toggleMusic, toggleSfx:toggleSfx, isMusicOn:function(){return AUDIO_SETTINGS.musicOn;}, isSfxOn:function(){return AUDIO_SETTINGS.sfxOn;} };
})();

function pickMood(pos){
  if(!pos) return "calm";
  if(pos.startsWith("RAND:")){
    const nm=RANDOM[pos.slice(5)]?RANDOM[pos.slice(5)].name:"";
    if(/异动|天灾|残页/.test(nm)) return "mystery";
    if(/推老人|找茬|被欺负/.test(nm)) return "tense";
    return "warm";
  }
  const b=BEATS[pos]; const node=b?b.node:"";
  if(/殉道|背剑离开/.test(node)) return "grand";
  if(/断长生桥|重伤|合战/.test(node)) return "tense";

/* ================= 核心体系：昼夜 / 天气 / 场景 / 心魔 ================= */
function recomputeXinmo(s){
  const z=s.zuijie||0, b=s.benxin||0, g=s.gongde||0;
  s.xinmo = clamp(Math.round(z*0.7 + Math.max(0,45-b)*0.6 - g*0.3), 0, 100);
  return s.xinmo;
}
function ensureAttrs(s){
  if(s.tupo==null) s.tupo=40;
  if(s.lingqi==null) s.lingqi=30;
  if(s.jianyi==null) s.jianyi=0;
  if(s.wuxing==null) s.wuxing=45;
  if(s.gengu==null) s.gengu=45;
  if(s.gongde==null) s.gongde=15;
  if(s.zuijie==null) s.zuijie=0;
  if(s.shengwang==null) s.shengwang=10;
  if(s.path==null) s.path="散修";
  if(s.shichen==null) s.shichen=4;
  if(s.weather==null) s.weather="晴";
  if(s.scene==null) s.scene="lizhu";
  recomputeXinmo(s);
}
/* 时间推进：每次进入真实节点推进 1~2 时辰；偶尔变天 */
function advanceTime(){
  state.shichen = (state.shichen + (1 + Math.floor(Math.random()*2))) % 12;
  if(Math.random()<0.18){
    state.weather = WEATHER[Math.floor(Math.random()*WEATHER.length)];
  } else if(state.weather==="雨" && state.shichen>=10 && Math.random()<0.3){
    state.weather="雷";
  } else if(state.weather==="雷" && Math.random()<0.4){
    state.weather="雨";
  }
}
function pickScene(pos){
  if(pos && pos.startsWith("RAND:")){
    const nm = RANDOM[pos.slice(5)] ? RANDOM[pos.slice(5)].name : "";
    if(/残页|剑经/.test(nm)) return "shujian";
    if(/井水|剑鸣|异动/.test(nm)) return "lizhu";
    if(/暴雨|天灾/.test(nm)) return "niping";
    return "niping";
  }
  const b = BEATS[pos]; const node = b?b.node:"";
  if(/序|外乡人涌入/.test(node)) return "lizhu";
  if(/宁姚入镇|顾璨被带走|搬山猿重伤|合战搬山猿|齐静春殉道|断长生桥|洞天破碎/.test(node)) return "niping";
  if(/背剑离开|护送李宝瓶|秋鹿客栈/.test(node)) return "shuyuan";
  if(/留守小镇/.test(node)) return "niping";
  if(/出镇后/.test(node)){
    if(has("剑气长城线")) return "changcheng";
    if(has("书简湖恩怨")) return "shujian";
    if(has("宁姚练剑")) return "changcheng";
    const pool=["changcheng","shujian","ouhua","manhuang"];
    return pool[(state.round||0)%pool.length];
  }
  return "lizhu";
}
/* 水墨场景 SVG（克制光影，拒绝浮夸） */

  const night = (phase==="night"||phase==="night-end");
  const c1 = night?"#0a0f18":"#262626";
  const c2 = night?"#141d2e":"#565656";
  const c3 = night?"#1d2a40":"#8a8a8a";
  let motif="";
  if(scene==="lizhu") motif = `<ellipse cx="500" cy="432" rx="240" ry="34" fill="${c2}" opacity=".5"/><rect x="468" y="360" width="64" height="62" fill="${c1}"/><path d="M468 360 L500 326 L532 360 Z" fill="${c1}"/>`;
  else if(scene==="niping") motif = `<g fill="${c1}" opacity=".72">${[120,260,420,600,760,900].map((x,i)=>`<rect x="${x}" y="${360-(i%2)*12}" width="84" height="74"/><path d="M${x} ${360-(i%2)*12} l42 -30 l42 30 Z"/>`).join("")}</g>`;
  else if(scene==="changcheng") motif = `<rect x="0" y="384" width="1000" height="44" fill="${c1}"/><g fill="${c1}">${Array.from({length:25},(_,i)=>`<rect x="${i*42}" y="360" width="30" height="24"/><rect x="${i*42-3}" y="348" width="36" height="14"/>`).join("")}</g><circle cx="500" cy="328" r="5" fill="#cdd6e0"/>`;
  else if(scene==="shujian") motif = `<rect x="0" y="402" width="1000" height="98" fill="${c3}" opacity=".45"/><g stroke="${c1}" opacity=".4">${[440,470,500,540,800].map(x=>`<line x1="${x}" y1="412" x2="${x}" y2="490"/>`).join("")}</g><path d="M0 402 Q500 382 1000 402" stroke="${c1}" fill="none" opacity=".5"/>`;
  else if(scene==="shuyuan") motif = `<g fill="${c1}">${[300,560].map(x=>`<rect x="${x}" y="350" width="124" height="82"/><path d="M${x-22} 350 Q${x+62} 298 ${x+146} 350 Z"/>`).join("")}</g><rect x="470" y="300" width="8" height="132" fill="${c1}"/><path d="M458 300 L492 278 L502 300 Z" fill="#b5462f"/>`;
  else if(scene==="ouhua") motif = `<rect x="0" y="402" width="1000" height="98" fill="${c3}" opacity=".45"/>${[200,400,600,800].map(x=>`<ellipse cx="${x}" cy="432" rx="42" ry="14" fill="${c2}" opacity=".6"/><circle cx="${x}" cy="420" r="10" fill="#d98aa0" opacity=".8"/>`).join("")}`;
  else if(scene==="manhuang") motif = `<g fill="${c1}">${[150,500,820].map((x,i)=>`<path d="M${x-130} 442 L${x} ${300-i*22} L${x+130} 442 Z"/>`).join("")}</g><circle cx="500" cy="300" r="40" fill="none" stroke="#b5462f" opacity=".5"/>`;
  const celestial = night
    ? `<circle cx="800" cy="118" r="46" fill="#e8e6d8" opacity=".85"/><circle cx="822" cy="108" r="46" fill="${sky[1]}" opacity=".5"/>`
    : `<circle cx="800" cy="116" r="50" fill="#f3e2b0" opacity=".9"/>`;
  return `<svg viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%">
    <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky[0]}"/><stop offset="1" stop-color="${sky[1]}"/></linearGradient></defs>
    <rect width="1000" height="500" fill="url(#sky)"/>
    ${celestial}
    <path d="M0 318 L160 248 L320 300 L500 228 L700 290 L860 238 L1000 298 L1000 500 L0 500 Z" fill="${c3}" opacity=".55"/>
    <path d="M0 380 L200 318 L420 370 L640 308 L860 360 L1000 328 L1000 500 L0 500 Z" fill="${c2}" opacity=".7"/>
    <path d="M0 442 L240 400 L480 442 L760 394 L1000 442 L1000 500 L0 500 Z" fill="${c1}"/>
    ${motif}

}

function beginGame(id, pathKey){
  const name=(document.getElementById("pname").value||"无名").trim().slice(0,8);
  const o=IDENTITIES[id];
  state={
    name, id, pos:"open", node:"序", round:0, sinceRandom:0,
    benxin:50, qixue:50, wufu:0, lianqi:0,
    tupo:40, lingqi:30, jianyi:0, wuxing:45, gengu:45,
    gongde:15, zuijie:0, shengwang:10, xinmo:0,
    path:"散修", shichen:4, weather:"晴", scene:"lizhu",
    items:["一个布包","几文钱"], relations:{}, flags:{}, returnTo:null, log:[], panelMode:"rich",
  };
  state.path = PATHS[pathKey] ? PATHS[pathKey].name : "散修";
  Object.entries(o.fx).forEach(([k,v])=>{ if(k in state) state[k]=clamp(state[k]+v,0,k==="qixue"?50:100); });
  if(PATHS[pathKey]) Object.entries(PATHS[pathKey].fx).forEach(([k,v])=>{ if(k in state) state[k]=clamp(state[k]+v,0,k==="qixue"?50:100); });
  recomputeXinmo(state);
  state.openLine=o.open;
  state.idName=o.name;
  pushLog(`出身【${o.name}】·道途【${state.path}】`);
  save(); renderBeat();
  Audio.startMusic(); Audio.setMood("calm");
}

function pushLog(t){ state.log.unshift(t); if(state.log.length>50) state.log.pop(); }
function has(f){ return !!state.flags[f]; }

function renderLines(arr){
  return arr.filter(l=> !l.if || has(l.if)).map(l=>{
    if(l.t==='nar') return `<span class="nar">${l.text}</span>`;
    if(l.t==='say') return `<span class="say"><span class="who">${l.who}：</span>${l.text}</span>`;
    return "";
  }).join("");
}

function renderBeat(){
  if(!state){ startScreen(); return; }
  // 死亡判定
  if(state.qixue<=0){ renderDeath("气血耗尽，你倒在了这片土地上。"); return; }
  ensureAttrs(state);
  const beat = state.pos.startsWith("RAND:") ? RANDOM[state.pos.slice(5)] : BEATS[state.pos];
  if(!beat){ renderBeatEnd(); return; }
  const nodeName = beat.node || beat.name || "自由";
  state.node = nodeName;
  renderScene();

  let html=`<div class="topbar"><div class="who">姓名 <b>${state.name}</b> · <span style="color:var(--gold2)">${state.idName}</span> · <span style="color:var(--jade)">${SCENE_NAME[state.scene]||"江湖"}</span> · <span style="color:var(--dim)">${SHICHEN[state.shichen]}·${WEATHER_NAME[state.weather]}</span></div>
    <div class="btns">
      <button class="btn" id="bPanel">修为</button>
      <button class="btn" id="bHint">提示</button>
      <button class="btn" id="bSave">存档</button>
      <button class="btn" id="bLoad">读档</button>
      <button class="btn" id="bRestart">重开</button>
      ${audioToggleHTML()}
    </div></div>`;

  html+=`<div class="card"><div class="chapter">${nodeName}</div>`;

  // 序章附身份开场
  if(state.pos==="open" && state.openLine){
    html+=`<div class="narr"><span class="nar">${state.openLine}</span></div>`;
  }
  html+=`<div class="narr">${renderLines(beat.lines)}</div>`;

  // 播报条
  const xinmoWarn = state.xinmo>=50 ? `｜<span style="color:var(--red)">心魔 ${state.xinmo}⚠</span>` : "";
  html+=`<div class="broadcast">【本心 ${state.benxin}·${benxinTier(state.benxin)}｜气血 ${state.qixue}/50｜武夫·${WUFU[state.wufu]}｜练气·${LIANQI[state.lianqi]}｜功德 ${state.gongde}·罪孽 ${state.zuijie}｜${SHICHEN[state.shichen]}·${WEATHER_NAME[state.weather]}】${xinmoWarn}</div>`;

  // 选项
  const choices=(beat.choices||[]).filter(c=> !c.if || has(c.if));
  html+=`<div class="choices">`+choices.map((c,i)=>{
    let tags="";
    if(c.tag) tags+=`<span class="tag">${c.tag}</span>`;
    return `<div class="choice" data-i="${i}"><span>${c.label}</span>${tags}${c.hint?`<span class="hint">${c.hint}</span>`:""}</div>`;
  }).join("")+`</div>`;

  // 自由行动
  html+=`<div class="free"><input id="freeIn" placeholder="自由行动：写下你想做的任何事……" maxlength="60"><button id="freeBtn">行动</button></div>`;

  html+=`</div>`;
  $app.innerHTML=html;

  // 绑定
  choices.forEach((c,i)=>{
    $app.querySelector(`.choice[data-i="${i}"]`).onclick=()=>applyChoice(c);
  });
  document.getElementById("freeBtn").onclick=()=>{
    const v=document.getElementById("freeIn").value.trim();
    if(!v){ toast("先写点什么"); return; }
    handleFree(v);
  };
  document.getElementById("bPanel").onclick=()=>renderStatsPanel();
  document.getElementById("bHint").onclick=()=>renderHintPanel();
  document.getElementById("bSave").onclick=()=>{ save(); toast("已存档"); };
  document.getElementById("bLoad").onclick=()=>{ if(load()){ renderBeat(); toast("已读档"); } else toast("暂无存档"); };
  document.getElementById("bRestart").onclick=()=>{ if(confirm("确定重开？当前进度将丢失。")) startScreen(); };
  bindAudioToggles();
}

function applyChoice(c){
  Audio.sfx("ui");
  if(c.death){ renderDeath(c.deathText||"你死了。"); return; }
  if(c.fx) applyFx(c.fx);
  if(c.tag) pushLog(c.tag);
  // 跳转
  let go=c.go;
  if(go==="__ending__"){ renderEnding(); return; }
  if(go==="__free__"){ setFreeReturn(state.pos); renderFreeMode(); return; }
  advanceTo(go);
}

function applyFx(fx){
  const bB=state.benxin,bQ=state.qixue,bW=state.wufu,bL=state.lianqi,bJ=state.jianyi,bG=state.gongde,bZ=state.zuijie;
  const numKeys=["benxin","qixue","wufu","lianqi","tupo","lingqi","jianyi","wuxing","gengu","gongde","zuijie","shengwang"];
  numKeys.forEach(k=>{ if(fx[k]) state[k]=clamp((state[k]||0)+fx[k],0, k==="qixue"?50:100); });
  if(fx.items){ // 字符串："加:xxx" 或 "去:xxx"
    fx.items.forEach(s=>{
      if(s.startsWith("加:")) state.items.push(s.slice(3));
      else if(s.startsWith("去:")){ const i=state.items.indexOf(s.slice(3)); if(i>=0) state.items.splice(i,1); }
    });
  }
  if(fx.xinmo) state.xinmo=clamp((state.xinmo||0)+fx.xinmo,0,100);
  else recomputeXinmo(state);
  // 心魔：破境不稳
  const upRealm=(state.wufu>bW)||(state.lianqi>bL)||(state.jianyi>bJ);
  if(upRealm && state.xinmo>60){ state.benxin=clamp(state.benxin-4,0,100); toast("心魔作祟，破境不稳（本心-4）"); }
  // 视听反馈：根据数值变化触发音效与特效
  const dW=state.wufu-bW, dL=state.lianqi-bL, dB=state.benxin-bB, dQ=state.qixue-bQ, dJ=state.jianyi-bJ;
  if(dW>0||dL>0||dJ>0){ Audio.sfx("levelup"); FX.glow(); }
  else if(dB>0||dQ>0){ Audio.sfx("good"); FX.flash("up"); }
  else if(dB<0||dQ<0){ Audio.sfx("bad"); FX.flash("down"); if(dQ<=-3){ Audio.sfx("hit"); FX.shake(); } }
  if(state.gongde>bG) Audio.sfx("good");
  if(state.zuijie>bZ){ Audio.sfx("bad"); FX.flash("down"); }
}

function advanceTo(go){
  // 随机事件注入
  state.round++;
  state.sinceRandom++;
  if(go!=="__return__" && state.sinceRandom>=2 && Math.random()<0.55){
    state.sinceRandom=0;
    const cand=RANDOM_KEYS.filter(k=> !RANDOM[k].if || has(RANDOM[k].if));
    const key=cand[Math.floor(Math.random()*cand.length)];
    state.returnTo=go; // 随机事件后回到原计划节点
    state.pos="RAND:"+key;
    advanceTime(); state.scene=pickScene(state.pos); recomputeXinmo(state);
    renderBeat();
    return;
  }
  let pos = (go==="__return__") ? (state.returnTo||"post_roam") : go;
  if(pos==="e9a" || (typeof pos==="string" && pos.indexOf("post")===0)) state.flags.left=true;
  state.pos=pos;
  advanceTime(); state.scene=pickScene(pos); recomputeXinmo(state);
  Audio.setMood(pickMood(pos));
  if(pos==="e_reveal_qi") Audio.sfx("reveal");
  save(); renderBeat();
}

function renderDeath(text){
  Audio.setMood("sorrow"); Audio.sfx("death"); FX.vignette();
  $app.innerHTML=`<div class="topbar"><div class="who">姓名 <b>${state.name}</b></div>
    <div class="btns">${audioToggleHTML()}<button class="btn" id="bRestart">重开</button></div></div>
    <div class="death"><div class="t">死 亡 · 收 束</div>
    <div class="d">${text}\n\n世界不会等你。想再走一遍——换一个身份，或换一条路。</div></div>
    <div class="footer">诸天万界，江湖再见。</div>`;
  clearSave();
  bindAudioToggles();
  document.getElementById("bRestart").onclick=()=>startScreen();
}

    <div class="card" style="text-align:center">

/* ================= 自由行动（关键词规则近似） ================= */
function setFreeReturn(pos){ state.returnTo=pos; }

function handleFree(text){
  const t=text;
  Audio.sfx("ui");
  let reaction="你做了这件事。风过巷口，没人特别在意——但你自己记得。";
  let fx={};
  if(/(打|揍|揍他|杀|砍)/.test(t)){
    const targets=["陈平安","宁姚","齐静春","刘羡阳","顾璨","搬山猿","蔡金简","杨老头","陆沉","宋集薪","阮秀","稚圭","刘志茂","马苦玄"];
    const hit=targets.find(n=>t.includes(n));
    if(hit){
      reaction=`你对${hit}动了手。按他的性子，这一下，结下了——或是一笔要还的账，或是一记更重的回击。`;
      fx={benxin:-3, qixue:-2, zuijie:4};
    } else { reaction="你对空气挥了几拳，像个不懂事的孩子。"; fx={benxin:-1, zuijie:1}; }
  } else if(/(骂|怼|嘲|讽)/.test(t)){
    reaction="你出言不逊。话出口容易，收回难——旁人看你的眼神，淡了一分。"; fx={benxin:-2, zuijie:2};
  } else if(/(偷|拿|摸|窃)/.test(t)){
    reaction="你伸手拿了不该拿的东西。世界有牙，偷来的，迟早要还。"; fx={benxin:-4, zuijie:5};
  } else if(/(撩|逗|调戏|喜欢你)/.test(t)){
    reaction="你拿这话去撩人。有人脸红拔剑，有人嗤之以鼻——总之，你惹了点动静。"; fx={benxin:-2};
  } else if(/(送|给|请|递|帮|救|护|扶)/.test(t)){
    reaction="你诚心待人、伸出手。护人者，人恒护之；古道热肠的人，记恩。"; fx={benxin:2, gongde:3};
  } else if(/(问|探|查|找)/.test(t)){
    reaction="你开口打探。肯答的人，自会答；不肯答的，你逼不出半句。"; fx={};
  } else if(/(练|修|学|打坐|悟|剑|拳|读|书|经)/.test(t)){
    reaction="你沉下心练了一会儿（或读一卷书）。成长不在一朝一夕，但这一步，算数。"; fx={benxin:1, lingqi:3, jianyi:2, wuxing:3};
  }
  applyFx(fx);
  if(fx.benxin||fx.qixue) pushLog("自由行动："+t.slice(0,12));
  // 回到原节点的自由模式展示
  const beat=BEATS[state.returnTo||state.pos];
  $app.insertAdjacentHTML("beforeend",
    `<div class="card"><div class="narr"><span class="nar">${reaction}</span></div>
     <div class="broadcast">【本心 ${state.benxin}·${benxinTier(state.benxin)}｜气血 ${state.qixue}/50｜武夫·${WUFU[state.wufu]}｜练气·${LIANQI[state.lianqi]}】</div>
     <div class="choices"><div class="choice" id="backChoice"><span>继续（回到刚才的路口）</span></div></div></div>`);
  const bc=document.getElementById("backChoice");
  if(bc) bc.onclick=()=>{ state.pos=state.returnTo||state.pos; state.returnTo=null; renderBeat(); };
  // 滚动到底
  window.scrollTo({top:document.body.scrollHeight, behavior:"smooth"});
}

function renderFreeMode(){
  // 自由模式下展示当前 beat 的旁白 + 一个自由输入框，可继续自由行动或点“继续”
  const beat=BEATS[state.returnTo]||BEATS[state.pos];
  $app.innerHTML=`<div class="topbar"><div class="who">姓名 <b>${state.name}</b> · 自由行动</div>
    <div class="btns"><button class="btn" id="bBack">回到路口</button><button class="btn" id="bPanel">修为</button></div></div>
    <div class="card"><div class="chapter">${beat?beat.node:"自由"}</div>
    <div class="narr"><span class="nar">你想做什么，都写下吧。世界会回应你——只是回应，未必如你所愿。</span></div>
    <div class="free"><input id="freeIn2" placeholder="写下你的行动……" maxlength="60"><button id="freeBtn2">行动</button></div>
    </div>`;
  document.getElementById("freeBtn2").onclick=()=>{
    const v=document.getElementById("freeIn2").value.trim(); if(!v){toast("先写点什么");return;}
    handleFree(v);
  };
  document.getElementById("bBack").onclick=()=>{ state.pos=state.returnTo; state.returnTo=null; renderBeat(); };
  document.getElementById("bPanel").onclick=()=>renderStatsPanel();
}

    <h4>修炼</h4><ul>
      <li>武夫：随剧情/采药/护人积累，破境需事件支撑</li>
      <li>练气士：寻名师指点（齐先生/阿良/宁姚）方可入门</li>
    </ul>
    <h4>心境 · 功德 · 天地</h4><ul>
      <li>心魔 = 罪孽 − 本心 − 功德；作恶杀戮积罪孽，读书行善消心魔。心魔过高破境不稳，甚至走火入魔</li>
      <li>功德/罪孽会被文庙、山神与各方势力记下，影响 NPC 对待与后续机缘</li>
      <li>昼夜晴雨时刻在变——雷雨助雷法，夜阑鬼魅更盛，留意顶部播报条</li>
    </ul>
  </div></div>`;
  showOverlay(html);
}
function nearUnmet(){
  const met=Object.keys(state.relations);
  const pool=["陈平安","宁姚","齐静春","刘羡阳","顾璨","杨老头","陆沉","阮秀","宋集薪","稚圭","刘志茂","搬山猿","蔡金简","郑大风","阿良","崔东山"];
  return pool.filter(p=>!met.includes(p)).slice(0,4).map(p=>`${p}：尚未深交`);
}

let overlayEl=null;
function showOverlay(html){
  if(!overlayEl){
    overlayEl=document.createElement("div");
    overlayEl.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:center;justify-content:center;padding:20px;";
    overlayEl.onclick=(e)=>{ if(e.target===overlayEl) overlayEl.remove(); };
    document.body.appendChild(overlayEl);
  }
  overlayEl.innerHTML=`<div style="max-height:86vh;overflow:auto;width:100%;max-width:640px" onclick="event.stopPropagation()">${html}<div style="text-align:center;margin-top:8px"><button class="btn" onclick="this.closest('.card').parentElement.parentElement.remove()">关闭</button></div></div>`;
  // 修正关闭逻辑
  const btn=overlayEl.querySelector("button");
  btn.onclick=()=>overlayEl.remove();
}

function renderBeatEnd(){
  $app.innerHTML=`<div class="card"><div class="narr">这一章到此。你说的「本章结束」，江湖自有回响。</div></div>`;
}

startScreen();
</script>
